<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='24'%20fill='white'/%3E%3Crect%20x='11'%20y='11'%20width='78'%20height='78'%20rx='20'%20fill='none'%20stroke='%23EA1A45'%20stroke-width='9'/%3E%3Cpath%20d='M70%2033%20H45%20a11%2011%200%200%200%20-11%2011%20V56%20a11%2011%200%200%200%2011%2011%20H70'%20fill='none'%20stroke='%23EA1A45'%20stroke-width='9'%20stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Command Center — Powered by Flux Athletics</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Match the app chrome so the system bars blend in, per light/dark. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191d26" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'default' lets iOS pick readable status-bar text for the current theme.
         'black-translucent' forces white text, which disappears against the light
         topbar. Layout still reserves the notch via env(safe-area-inset-*) in CSS. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Command Center" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blank-screen self-heal: if the app hasn't rendered a few seconds after
      // load, a stale cache or service worker is the usual cause. Clear them and
      // reload exactly once (guarded so a genuine error can't loop).
      (function () {
        function heal() {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) { sessionStorage.removeItem('cc-recover'); return; }
          if (sessionStorage.getItem('cc-recover')) return;
          sessionStorage.setItem('cc-recover', '1');
          var reload = function () { location.reload(); };
          Promise.resolve()
            .then(function () {
              if ('serviceWorker' in navigator)
                return navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister(); }));
                });
            })
            .then(function () {
              if (window.caches) return caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              });
            })
            .then(reload, reload);
        }
        window.addEventListener('load', function () { setTimeout(heal, 4000); });
      })();
    </script>
  </body>
</html>
